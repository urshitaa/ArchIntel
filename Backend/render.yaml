services:

  - type: web
    name: codebase-api

    runtime: docker

    plan: starter

    dockerfilePath: ./Dockerfile

    healthCheckPath: /api/v1/health

    envVars:
      - key: APP_ENV
        value: production

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: MONGODB_URL
        sync: false

      - key: MONGODB_DB
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: GITHUB_TOKEN
        sync: false

      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: codebase-analysis-worker

    runtime: docker

    dockerfilePath: ./Dockerfile

    dockerCommand: ./scripts/start_worker.sh

    plan: starter

    envVars:
      - key: APP_ENV
        value: production

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: MONGODB_URL
        sync: false

      - key: MONGODB_DB
        sync: false

      - key: OPENAI_API_KEY
        sync: false